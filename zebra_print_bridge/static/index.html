<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zebra Print Bridge</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2129; --muted: #6b7280; --border: #e3e6eb;
    --accent: #2563eb; --accent-bg: #eaf1ff; --ok: #15803d; --ok-bg: #e8f6ec;
    --warn: #b45309; --warn-bg: #fdf3e2; --err: #b91c1c; --err-bg: #fdecec; --code: #f3f4f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318; --panel: #1a1d24; --text: #e6e8ec; --muted: #9aa1ad; --border: #2b303a;
      --accent: #7aa7ff; --accent-bg: #1f2b45; --ok: #5bd28a; --ok-bg: #173225;
      --warn: #f2b357; --warn-bg: #3a2d16; --err: #ff8080; --err-bg: #3d1c1c; --code: #14161b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0; }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  main { display: grid; grid-template-columns: 290px minmax(300px, 1fr) minmax(420px, 1.5fr);
         gap: 12px; padding: 12px; height: calc(100vh - 53px); }
  @media (max-width: 1150px) { main { grid-template-columns: 1fr; height: auto; } }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            display: flex; flex-direction: column; min-height: 0; }
  section > h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
                 margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--border);
                 display: flex; align-items: center; gap: 8px; min-height: 41px; }
  .scroll { overflow: auto; flex: 1; min-height: 0; }
  button, select, input, textarea { font: inherit; color: inherit; }
  button, a.button { background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
           padding: 4px 10px; cursor: pointer; color: inherit; text-decoration: none; white-space: nowrap; }
  button:hover, a.button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--err); color: var(--err); }
  select, input, textarea { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  label.field { display: inline-flex; align-items: center; gap: 6px; }
  .badge { display: inline-block; padding: 0 7px; border-radius: 10px; font-size: 11px; font-weight: 600;
           background: var(--code); color: var(--muted); white-space: nowrap; }
  .b-label { background: var(--accent-bg); color: var(--accent); }
  .b-graphics, .b-calibrate, .b-config, .b-warn { background: var(--warn-bg); color: var(--warn); }
  .b-ok { background: var(--ok-bg); color: var(--ok); }
  .b-err { background: var(--err-bg); color: var(--err); }
  .printer { padding: 10px 12px; border-bottom: 1px solid var(--border); }
  .printer .name { font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .printer .uid { color: var(--muted); word-break: break-all; }
  .printer details { margin-top: 6px; }
  .printer summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .flags { display: grid; gap: 2px; margin: 6px 0; font-size: 12px; }
  .presets { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
  .presets button { font-size: 12px; padding: 2px 8px; }
  form.add { padding: 10px 12px; display: grid; gap: 6px; border-top: 1px solid var(--border); }
  form.add .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  input.num { width: 70px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  tr.job { cursor: pointer; }
  tr.job:hover td { background: var(--accent-bg); }
  tr.job.selected td { background: var(--accent-bg); }
  tr.job.selected td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px;
             border-bottom: 1px solid var(--border); }
  .toolbar.flat { padding: 0; border: 0; }
  .detail { padding: 12px; display: grid; gap: 14px; }
  .detail h3 { font-size: 13px; margin: 0 0 6px; }
  pre { margin: 0; background: var(--code); border: 1px solid var(--border); border-radius: 6px; padding: 8px;
        white-space: pre-wrap; word-break: break-all; max-height: 320px; overflow: auto; }
  textarea.zpl { width: 100%; min-height: 220px; resize: vertical; background: var(--code);
                 font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 1.5; }
  .ctl { color: var(--accent); }
  .preview { border: 1px solid var(--border); border-radius: 6px; }
  .preview .controls { display: flex; gap: 10px 14px; flex-wrap: wrap; align-items: center; padding: 8px 10px;
                       border-bottom: 1px solid var(--border); font-size: 12px; }
  .preview .controls .muted { font-size: 11px; }
  .preview .stage { padding: 10px; display: grid; place-items: center; min-height: 140px; background:
                    repeating-conic-gradient(var(--code) 0% 25%, transparent 0% 50%) 50% / 16px 16px; }
  .preview img { max-width: 100%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); display: block; }
  .preview .footer { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 8px 10px;
                     border-top: 1px solid var(--border); font-size: 12px; }
  .warnings { display: grid; gap: 6px; }
  .warning { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
  .notice { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 8px 10px; font-size: 12px; }
  .empty { padding: 24px; text-align: center; color: var(--muted); }
  .error-text { color: var(--err); }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--text);
           color: var(--bg); padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: .95; }
</style>
</head>
<body>
<header>
  <h1>Zebra Print Bridge</h1>
  <span class="muted mono" id="version"></span>
  <span class="spacer"></span>
  <label class="field"><span data-i18n="header.language"></span> <select id="lang"></select></label>
  <label class="field"><span data-i18n="header.units"></span>
    <select id="units"><option value="in">in</option><option value="cm">cm</option><option value="mm">mm</option></select>
  </label>
  <label class="check" id="labelary-toggle" hidden data-i18n-title="header.preview_hint">
    <input type="checkbox" id="labelary"> <span data-i18n="header.preview"></span>
  </label>
</header>

<main>
  <section>
    <h2><span data-i18n="printers.title"></span> <span class="spacer"></span><span class="badge" id="printer-count">0</span></h2>
    <div class="scroll" id="printers"></div>
    <form class="add" id="add-form">
      <strong data-i18n="printers.add_title"></strong>
      <input name="name" data-i18n-placeholder="printers.add_name" required>
      <div class="row">
        <select name="dpi" id="add-dpi"></select>
        <select id="add-preset"></select>
      </div>
      <div class="row">
        <input name="width" class="num" type="number" step="any" min="0" required> ×
        <input name="height" class="num" type="number" step="any" min="0" required>
        <span class="muted unit-label"></span>
      </div>
      <button class="primary" type="submit" data-i18n="printers.add_button"></button>
    </form>
  </section>

  <section>
    <h2><span data-i18n="jobs.title"></span> <span class="spacer"></span><span class="badge" id="job-count">0</span></h2>
    <div class="toolbar">
      <select id="filter-printer"></select>
      <label class="check"><input type="checkbox" id="show-status"> <span data-i18n="jobs.show_status"></span></label>
      <span class="spacer"></span>
      <button id="new-zpl" data-i18n="jobs.new_zpl"></button>
      <button class="danger" id="clear" data-i18n="jobs.clear"></button>
    </div>
    <div class="scroll">
      <table>
        <thead><tr><th data-i18n="jobs.time"></th><th data-i18n="jobs.printer"></th><th data-i18n="jobs.kind"></th><th data-i18n="jobs.size"></th></tr></thead>
        <tbody id="jobs"></tbody>
      </table>
      <div class="empty" id="jobs-empty" data-i18n="jobs.empty"></div>
    </div>
  </section>

  <section>
    <h2 id="detail-title" data-i18n="detail.title"></h2>
    <div class="scroll" id="detail"></div>
  </section>
</main>
<div id="toast"></div>

<script src="/ui/assets/i18n.js"></script>
<script src="/ui/assets/app.js"></script>
</body>
</html>
