[project]
name = "zebra-print-bridge"
version = "0.2.0"
description = "Local replacement for Zebra Browser Print on Linux, with virtual printers and a ZPL viewer"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zebra-print-bridge = "zebra_print_bridge.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zebra_print_bridge"]

[tool.setuptools.package-data]
zebra_print_bridge = ["static/*"]
